kind = "mobile"
previewPath = "/mono-chrome-qr/"
title = "Mono Chrome QR"
description = "A privacy-first professional QR profile builder and scanner with multi-content profiles, reusable templates, local history, customization, export, and English/Arabic support."
version = "1.0.0"
id = "artifacts/mono-chrome-qr"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/mono-chrome-qr/" ]
localPort = 25933

[services.development]
run = "pnpm --filter @workspace/mono-chrome-qr run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/mono-chrome-qr", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/mono-chrome-qr", "run", "serve" ]

[services.env]
PORT = "25933"
BASE_PATH = "/mono-chrome-qr/"
