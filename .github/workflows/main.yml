name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "pnpm-workspace.yaml"

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies and create lockfile
        run: pnpm install --no-frozen-lockfile

      - name: Commit lockfile
        run: |
          if [ -f pnpm-lock.yaml ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pnpm-lock.yaml
            git diff --cached --quiet || git commit -m "chore: add pnpm lockfile"
            git push
          fi

      - name: Link EAS project
        run: pnpm dlx eas-cli@latest init --force --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Build APK with EAS
        run: pnpm dlx eas-cli@latest build --platform android --profile preview --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
